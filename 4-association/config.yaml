# =============================================================================
# El Paso Seismic Network - Association Configuration
# =============================================================================

# Path to station list (JSON), relative to working directory (project root)
stations_file: "stations.json"

# -----------------------------------------------------------------------------
# I/O directories
# -----------------------------------------------------------------------------

# Where detection results live (output of detection)
input_dir: "output"

# Where association results will be written
output_dir: "output"

# -----------------------------------------------------------------------------
# Network center (approximate centroid of 11 stations)
# -----------------------------------------------------------------------------
center_lat: 31.85
center_lon: -106.40

# -----------------------------------------------------------------------------
# Search region (degrees from center)
# Narrowed 1.5 → 1.0 (~110 km half-extent) to focus on local seismicity:
# El Paso network footprint + Vado/Anthony quarry belt + Las Cruces.
# Regional events (>110 km) had bad azimuthal geometry anyway and only
# contributed to noisy boundary locations. Pairs with the NLLoc grid in
# lib/location/nlloc_config.py.
# -----------------------------------------------------------------------------
xlim_degree: 1.0
ylim_degree: 1.0
zlim_km: [0, 30]

# Degrees-to-km conversion at this latitude
degree2km: 111.19

# -----------------------------------------------------------------------------
# 1D velocity model (km/s)
#
# DELIBERATE TUNING (Mar 2026, commit 9243c09) — differs from SCIENCE_AUDIT
# Issue 10's recommendation (6.0/3.47). Our sources are shallow quarry blasts
# whose rays travel mostly through slow Hueco Bolson / Rio Grande Rift basin
# fill, so a lower path-average velocity associates better than a basement
# value. Note GaMMA remains homogeneous while NLLoc relocation uses the
# 6-layer West Texas model (lib/location/velocity_model.py); this mismatch is
# accepted because every published event is manually relocated with NLLoc.
# -----------------------------------------------------------------------------
vel:
  P: 5.0
  S: 2.89

# -----------------------------------------------------------------------------
# Association method: BGMM (Bayesian) or GMM
# -----------------------------------------------------------------------------
method: "BGMM"

# -----------------------------------------------------------------------------
# DBSCAN pre-clustering
#
# DELIBERATE TUNING (Feb 2026, commit 1d69e7d) — differs from SCIENCE_AUDIT
# Issue 11's recommendation (25 s). Operator experience on this sparse network
# is that the larger eps yields more accurate/complete associations; the
# merged-event risk it carries is handled during manual review (a duplicate
# guard exists in the dashboard save path and scripts/dedup_catalog.py).
# -----------------------------------------------------------------------------
use_dbscan: true
dbscan_eps: 60            # seconds (max travel time + max P-S + margin)
dbscan_min_samples: 3

# -----------------------------------------------------------------------------
# Event quality filters
# -----------------------------------------------------------------------------
min_picks_per_eq: 4          # At least 4 phase picks total (3P + 1S minimum)
min_p_picks: 3                # minimum P-phase picks per event
min_s_picks: 1                # minimum S-phase picks per event (lowered from 2 to 1)
min_stations_per_eq: 3        # minimum unique stations per event (post-association QC)
max_sigma11: 2.0          # max time residual std (s)
max_sigma22: 2.0          # max amplitude residual std (log10)
oversample_factor: 5

# -----------------------------------------------------------------------------
# Pick quality filter
# -----------------------------------------------------------------------------
min_pick_probability: 0.5     # Raised from 0.4 per SCIENCE_AUDIT.md Issue 6

# -----------------------------------------------------------------------------
# Default time window (scheduled mode)
# -----------------------------------------------------------------------------
assoc_window_hours: 24
assoc_latency_hours: 6

# -----------------------------------------------------------------------------
# Local magnitude (ML) — Hutton & Boore (1987)
# -----------------------------------------------------------------------------
ml_freq_hz: 5.0              # Dominant frequency for vel->disp conversion (Hz)
ml_wa_gain: 2800              # Wood-Anderson static magnification (Uhrhammer & Collins 1990)
ml_min_distance: 10.0         # Minimum hypocentral distance (km), per Hutton & Boore calibration range

# Attenuation coefficients:
#   ML = log10(A_wa) + a*log10(r/ref) + b*(r-ref) + c
ml_a: 1.110
ml_b: 0.00189
ml_c: 3.0
ml_ref_distance: 100.0        # Reference distance (km)

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log_dir: "logs"
log_max_bytes: 10485760    # 10 MB per log file
log_backup_count: 5        # keep 5 rotated files
