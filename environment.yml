name: elpaso-quake
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10,<3.13
  - obspy=1.4.1
  - pyyaml=6.0.2
  - pyproj=3.7.0
  - numpy>=1.26,<2.4      # numba 0.63 rejects numpy >= 2.4 (import error)
  - scipy=1.14.1
  - matplotlib=3.9.4
  - pandas=2.2.3
  - eqcorrscan=0.5.2     # template matching for repeating-source detection
  - pip
  - pip:
      - torch==2.2.1
      - seisbench==0.6.1
      - xdas>=0.2.0
      - gmma @ git+https://github.com/wayneweiqiang/GaMMA.git@c156136ed7afe3b585c2da2f6021268aca460808
      - fastapi==0.115.6
      - uvicorn[standard]==0.34.0
      - pywebview>=5.0
      - httpx==0.28.1
