# =============================================================================
# El Paso Seismic Network - Detection Configuration
# =============================================================================

# Path to station list (JSON), relative to working directory (project root)
stations_file: "stations.json"

# -----------------------------------------------------------------------------
# I/O directories
# -----------------------------------------------------------------------------

# Where raw waveforms live (output of ingestion)
input_dir: "output"

# Where detection results will be written
output_dir: "output"

# -----------------------------------------------------------------------------
# PhaseNet standalone model
# -----------------------------------------------------------------------------

# Path to pretrained model checkpoint directory
phasenet_model_dir: "3-detection/model/190703-214543"

# Python interpreter with TensorFlow installed.
# Uses the "phasenet" conda env to isolate TF from the main env.
# Adjust this path for your machine, or set to null to use the current interpreter.
phasenet_python: "phasenet"  # resolved via `conda run -n phasenet`

# Pick probability thresholds
p_threshold: 0.4
s_threshold: 0.4

# Highpass pre-filter applied before PhaseNet inference (Hz).
# Removes microseism and tilt noise.
highpass_freq: 3.0

# Minimum peak distance in samples (0.5s at 100Hz)
min_peak_distance: 50

# Default time window when --start/--end are not provided
detect_window_hours: 24
detect_latency_hours: 6

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log_dir: "logs"
log_max_bytes: 10485760    # 10 MB per log file
log_backup_count: 5        # keep 5 rotated files
