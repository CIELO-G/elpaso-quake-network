# tools/snr-analysis/config.yaml

# Pipeline paths (read-only)
pipeline_root: "../../"
stations_file: "../../stations.json"
catalog_file: "../../output/5-catalog/catalog.csv"
assignments_file: "../../output/5-catalog/assignments.csv"
processed_dir: "../../output/2-processed"

# FDSN data sources
fdsn_sources:
  AM: "https://data.raspberryshake.org"
  EP: "IRIS"

# Event scenarios (fill in after running fetch_events.py)
events:
  local:
    event_id: null
    origin_time: null
    latitude: null
    longitude: null
    depth_km: null
    magnitude: null
  regional_low:
    event_id: null
    origin_time: null
    latitude: null
    longitude: null
    depth_km: null
    magnitude: null
  regional_high:
    event_id: null
    origin_time: null
    latitude: null
    longitude: null
    depth_km: null
    magnitude: null

# Network center (for distance/catalog queries)
center_lat: 31.85
center_lon: -106.40

# USGS catalog search
catalog_search:
  min_radius_km: 0
  max_radius_km: 500
  start_date: "2025-09-01"
  end_date: null  # defaults to today

# SNR parameters
snr:
  noise_window_sec: 30
  noise_gap_sec: 5
  signal_after_s_sec: 10
  frequency_bands:
    broadband: [1.0, 45.0]
    low: [1.0, 5.0]
    mid: [5.0, 15.0]
    high: [15.0, 40.0]

# Detection thresholds
thresholds:
  detection_snr: 3.0
  good_snr: 10.0

# Processing (if fetching raw data)
processing:
  filter_freqmin: 1.0
  filter_freqmax: 45.0
  pre_filt: [0.5, 1.0, 40.0, 45.0]
  water_level: 60
  output: "VEL"

# TauP
velocity_model: "iasp91"

# Stations to exclude from plots
exclude_stations: ["R5912", "R9070", "R3B56", "R8DE2"]

# Site type classification
site_types:
  bedrock: ["R4B41", "RE2E7", "RADA1", "KIDD"]
  basin: ["R0F2D", "R3E95", "RDB14", "S50BE", "RC9B8"]

# Output
output_dir: "output"
figure_dpi: 300
figure_formats: ["png", "pdf"]
